[project]
name = "blend"
version = "0.1.0"
description = "Blender modeling sessions driven through blender-mcp"
readme = "README.md"
authors = [
    { name = "David Morgan", email = "haitheredavid@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pillow>=12.3.0",
    "prompt-toolkit>=3.0.53",
    "pydantic-settings>=2.15.0",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
blend = "blend:main"

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fake-bpy-module-5-2>=20260730",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "ty>=0.0.89",
]

[tool.ty.environment]
# lib/ and blender_scripts/ go on sys.path at runtime (builders, headless scripts).
extra-paths = ["lib", "blender_scripts"]

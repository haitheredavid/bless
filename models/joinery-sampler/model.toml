name = "joinery-sampler"
created = "2026-10-17"
intent = "PETG reference set of common FDM joints (interlocking, pins & tenons, snap & twist): each joint is a matched pair of labelled 18 mm bars, one nominal A against three B's swept over clearance, generated by a reusable joint library (lib/patterns/joints) that later models reuse."
status = "active"             # active | done (`blend model done` sets it)
workflows = ["mcp-modeling-loop", "gn-patterns", "variant-grid-exploration", "print-fit-and-sectioning", "print-handoff", "render-views-and-sections"]
tags = ["3d-print", "joinery", "reference", "parametric", "coupon"]

[units]                       # applied by `blend model new`; 1 Blender unit = 1 m by default
scale_length = 0.001            # 0.001 + length_unit = "MILLIMETERS" for mm-scale work
length_unit = "MILLIMETERS"

[export]                      # `blend export`
formats = ["stl", "glb"]      # stl for the slicer; glb for viewing
split = true                  # one file per part
collection = "Print_Interlock"

[render]                      # `blend render` studio still -> render.png
# framing = "fit"             # fit: fill the frame; wide: show the floor around it
# scene = "Scene"             # scene to render (default: the saved one)

# `blend views` shots. Board lies on z=0: families in rows along +Y, joints along +X.
[[views]]
name = "hero"                 # the whole board, 3/4
azimuth = -55
elevation = 35

[[views]]
name = "plan"                 # top-down, labels readable
azimuth = -90
elevation = 89

[print]                       # `blend print-pack <m> --collection Print_<Family>` -> print/print_<family>/
collection = "Print_Interlock"   # one pack per family: Print_Interlock, Print_Pins, Print_Snap
bed = 256                     # mm, square (Bambu Lab P1S)
printer = "Bambu Lab P1S"
material = "PETG"
orientation = "as modelled, z up: bars stand on their 25 x 18 bottom face with sockets and pockets open upward or through (trapezoids in the layer plane, no overhangs); the butterfly key lies flat. No supports. Per-joint reasons: builders/catalog.py `why`."
hardware = []
assembly = [
  "Each joint is one A bar (nominal) and three B bars (and sockets) at the clearances engraved on them, plus a loose key/pin/tenon where the joint has one.",
  "Try A in each B from the tightest up; log the best fit per joint with bambi log fit (tight / good / loose).",
]
# feedback_applied = []      # results.json recommendation ids taken (`blend print-results`)
# feedback_declined = []     # ...or turned down; re-pack after editing

[[print.part]]
match = "*"
supports = "none"
supports_why = "sockets and pockets are vertical through-cuts or open upward; every roof is the open top"

[[print.part]]
match = "BK_K"
flat = true
orientation_why = "key flat, both faces chamfered: no elephant's foot on the edge that enters the pocket"

# [[print.filament]]          # multi-material only
# id = 1
# role = "body"
# material = "pla"
# color = "#111111"
# profile_hint = "pla_basic"  # a bambi filament profile

[[print.coupon]]
id = "DT"
param = "builders/catalog.py:DT.fit"
values = [0.15, 0.20, 0.30]
parts = { "0.15" = ["DT_A", "DT_B15"], "0.20" = ["DT_A", "DT_B20"], "0.30" = ["DT_A", "DT_B30"] }
rule = "tightest B that DT_A slides fully down into by hand without rocking"

[[print.coupon]]
id = "BK"
param = "builders/catalog.py:BK.fit"
values = [0.05, 0.10, 0.15]
parts = { "0.05" = ["BK_A05", "BK_B05", "BK_K"], "0.10" = ["BK_A10", "BK_B10", "BK_K"], "0.15" = ["BK_A15", "BK_B15", "BK_K"] }
rule = "tightest pair BK_K presses into with thumb pressure and holds the bars together when lifted by one bar"

# [print.Coupon]              # `blend print-pack <m> --collection Coupon` -> print/coupon/
# orientation = ""            # replaces orientation/flat/hardware/assembly/intent/feedback_*;
                              # [[print.Coupon.part]] etc. replace the inherited arrays

# [site]                      # Pages viewer; `blend export <m> --web` publishes the model
# parts = "Print"             # collection shown as "print parts" (default [print] collection; "" for none)
# upright = true              # stand it up as hung (default: the hero view's upright)
# speckle = false             # link the Speckle project (only once it's public)

[speckle]                     # /checkpoint publishes here; see .context/speckle-guide.md
account = "haitheredavid@gmail.com"   # chosen by email, never the connector's default
project_id = "de2b7457ae"     # app.speckle.systems project "blender-sessions"

[turntable]                   # `blend turntable` -> out/<session>-turntable.mp4 + .gif
frames = 120
fps = 30

name = "joinery-sampler-print_interlock"
created = "2026-10-17"
intent = "PETG reference set of common FDM joints (interlocking, pins & tenons, snap & twist): each joint is a matched pair of labelled 18 mm bars, one nominal A against three B's swept over clearance, generated by a reusable joint library (lib/patterns/joints) that later models reuse."

[paths]                       # a print pack: the files below belong to the modelling repo
kind = "pack"
blend = "parts.blend"
exports = "stl"
out = "out"                   # bambi's: sliced files (gitignore it upstream)

[source]                      # what `bambi init` read; `bambi status` compares the live spec
repo = "blender-sessions"
model = "joinery-sampler"
pack = "print_interlock"
spec_created = "2026-10-17T11:04:50-04:00"
spec_hash = "1ae193ec5b037dda"

[slice]
machine = "p1s_0.4"           # profiles/machine/<name>.json
process = "0.20mm_standard"
filament = "petg_hf"
plate = "Textured PEI Plate"  # or Cool Plate, Engineering Plate, High Temp Plate, Supertack Plate
orient = false                # packs arrive in print orientation; Bambu's auto-orient fights it
arrange = true

[slice.overrides]             # supports = 'none' from the spec
enable_support = 0

[print]
ams_slot = 0                  # AMS tray (0-15), or -1 for external spool
